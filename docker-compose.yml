version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartpark-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/smartpark
      - JWT_SECRET=production_supersecret_smartpark_jwt_key_2026
      - JWT_EXPIRES_IN=7d
    depends_on:
      - mongo

  mongo:
    image: mongo:7.0
    container_name: smartpark-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
    driver: local

